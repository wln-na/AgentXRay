# Version-update PRs are DISABLED (open-pull-requests-limit: 0) — no automatic bump PRs.
# Minor/patch bumps were previously grouped per ecosystem; major bumps got their own PR.
# Security updates are handled separately by GitHub's alert flow (toggle in repo settings).
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      githubactions-all:
        patterns: ["*"]
    commit-message:
      prefix: chore
